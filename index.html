<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Furniture Configurator</title>
  </head>
  <body>
    <div id="app"></div>
    <div
      id="splash"
      class="splash"
      role="status"
      aria-live="polite"
      aria-busy="true"
    >
      <p class="splash__title">Furniture Configurator</p>
      <p id="splash-pct" class="splash__pct">0%</p>
      <p id="splash-status" class="splash__status">Loading 3D model…</p>
      <button id="splash-retry" class="splash__retry" type="button" hidden>
        Retry
      </button>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
