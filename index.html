<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta
      name="description"
      content="Configure armchair and sofa finishes in 3D, then preview in your room with AR."
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link
      rel="preload"
      href="/fonts/dm-sans-latin-400-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <title data-i18n="app.title">Furniture Configurator</title>
  </head>
  <body>
    <div id="app"></div>
    <div
      id="splash"
      class="splash"
      role="status"
      aria-live="polite"
      aria-busy="true"
    >
      <p class="splash__title" data-i18n="app.title">Furniture Configurator</p>
      <p id="splash-pct" class="splash__pct">0%</p>
      <p id="splash-status" class="splash__status" data-i18n="splash.loading">
        Loading 3D model…
      </p>
      <button
        id="splash-retry"
        class="splash__retry"
        type="button"
        hidden
        data-i18n="splash.retry"
      >
        Retry
      </button>
    </div>
    <div id="webgl-poster" class="webgl-poster" hidden>
      <p data-i18n="webgl.unsupported">
        WebGL is not available on this device or browser.
      </p>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
